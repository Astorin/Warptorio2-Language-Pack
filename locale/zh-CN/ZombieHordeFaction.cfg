[mod-setting-description]
zombiefactionhealth=调整丧尸生命值。0.5表示比普通撕咬者生命值低2倍。1表示普通撕咬者生命值
zombiefactionspeed=调整丧尸移动速度。0.5表示比普通撕咬者移动速度低2倍。1表示普通撕咬者移动速度
zombiefactionspawners=选择丧尸母体的外观
zombiefactionforce=阻止相互攻击
zombiefactionspawnerfriends=模组默认值为 20。原版默认值为 5

